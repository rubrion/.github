name: release-please

# Conventional-commits → version + changelog. On push to the default branch,
# opens/updates a "release" PR that bumps the package version (feat→minor,
# fix→patch, `!`→major) and maintains CHANGELOG.md. Merge the PR to cut the
# release + tag. Pair this with release-please-config.json and
# .release-please-manifest.json at the repo root (see rubrion/.github →
# templates/flutter-store-app).
#
# The STORE build number (Android versionCode / iOS CFBundleVersion) is NOT
# managed here — inject it in CI per build (Codemagic $PROJECT_BUILD_NUMBER),
# shared across stores so uploads stay unique + monotonic.

on:
  push:
    branches: [$default-branch]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
