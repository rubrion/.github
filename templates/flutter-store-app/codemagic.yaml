# Flutter → Play Store + App Store, template.
# Replace every CHANGE_ME. Branch decides env: main → prod, else → staging.
#
# Versioning model (works for BOTH stores):
#   • semver (X.Y.Z) lives in pubspec `version:` — bumped by release-please from
#     Conventional Commits (see release-please-config.json + the release-please
#     workflow). Do NOT hand-edit it.
#   • build number (Android versionCode / iOS CFBundleVersion) is injected here as
#     $PROJECT_BUILD_NUMBER — Codemagic's project-wide monotonic counter, shared
#     by both workflows, so uploads are always unique + increasing on each store.
#   • "what's new" per store comes from the latest CHANGELOG.md section
#     (release_notes.txt), generated below.

workflows:
  android-playstore:
    name: Android · Google Play (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: CHANGE_ME_flutter_version   # e.g. 3.44.3
      java: 17
      android_signing:
        - CHANGE_ME_keystore_reference      # uploaded in Codemagic code signing
      groups:
        - CHANGE_ME_env_group               # holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, GOOGLE_PLAY_TRACK
    working_directory: frontend
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Resolve environment from branch
        script: |
          if [ "$CM_BRANCH" = "main" ]; then
            echo "ENV_FILE=env/prod.env" >> "$CM_ENV"
          else
            echo "ENV_FILE=env/staging.env" >> "$CM_ENV"
          fi
      - name: Set up release signing
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build release AAB
        script: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d ' ' | cut -d+ -f1)
          flutter build appbundle \
            --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file=$ENV_FILE \
            --dart-define=APP_VERSION="$APP_VERSION"
      - name: Release notes from CHANGELOG
        script: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{n++} n==1{print} n==2{exit}' CHANGELOG.md > release_notes.txt
          fi
          [ -s release_notes.txt ] || echo "Build $PROJECT_BUILD_NUMBER" > release_notes.txt
          cat release_notes.txt
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - release_notes.txt
    publishing:
      # Declarative publish does NOT push "what's new". To auto-fill it, swap for a
      # scripted `google-play` publish using release_notes.txt:
      #   --release-notes "pt-BR=$(cat release_notes.txt)"
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK

  ios-appstore:
    name: iOS · App Store (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CHANGE_ME_asc_api_key_name
    environment:
      flutter: CHANGE_ME_flutter_version
      xcode: latest
      groups:
        - CHANGE_ME_env_group
    working_directory: frontend
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Resolve environment from branch
        script: |
          if [ "$CM_BRANCH" = "main" ]; then
            echo "ENV_FILE=env/prod.env" >> "$CM_ENV"
          else
            echo "ENV_FILE=env/staging.env" >> "$CM_ENV"
          fi
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "CHANGE_ME_bundle_id" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d ' ' | cut -d+ -f1)
          flutter build ipa \
            --release \
            --export-method app-store \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file=$ENV_FILE \
            --dart-define=APP_VERSION="$APP_VERSION"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      # Add release notes via app_store_connect / fastlane deliver using
      # release_notes.txt (same source as Android).
      app_store_connect:
        auth: integration
        submit_to_testflight: true
