name: release-please (reusable)

# Org-wide reusable release-please. Call it from an app repo:
#
#   # .github/workflows/release-please.yml (in the app repo)
#   name: release-please
#   on: { push: { branches: [main] } }
#   permissions: { contents: write, pull-requests: write }
#   jobs:
#     release:
#       uses: rubrion/.github/.github/workflows/release-please.yml@main
#
# The app repo keeps its own release-please-config.json + .release-please-manifest.json
# at the root (paths overridable via inputs). Store build numbers are injected in
# CI (Codemagic $PROJECT_BUILD_NUMBER), not here.

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
