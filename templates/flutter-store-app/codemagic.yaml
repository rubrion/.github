# Flutter → Play Store + App Store, template (push-based versioning).
# Replace every CHANGE_ME. Branch decides env: main → prod, else → staging.
#
# Versioning model (no release PRs — fits a solo maintainer):
#   • semver (X.Y.Z): the pubspec `version:` line — bump it by hand per release.
#   • build number (Android versionCode / iOS CFBundleVersion): injected here as
#     $PROJECT_BUILD_NUMBER — Codemagic's project-wide monotonic counter, shared
#     by both workflows, so uploads are always unique + increasing on each store.
#     (Set the project build number above the latest store versionCode once.)
#   • "what's new": generated at build from Conventional Commits since the last
#     release tag; each release is tagged (best-effort) to move the baseline.

workflows:
  android-playstore:
    name: Android · Google Play (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: CHANGE_ME_flutter_version   # e.g. 3.44.3
      java: 17
      android_signing:
        - CHANGE_ME_keystore_reference      # uploaded in Codemagic code signing
      groups:
        - CHANGE_ME_env_group               # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, GOOGLE_PLAY_TRACK
    working_directory: frontend
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Resolve environment from branch
        script: |
          if [ "$CM_BRANCH" = "main" ]; then
            echo "ENV_FILE=env/prod.env" >> "$CM_ENV"
          else
            echo "ENV_FILE=env/staging.env" >> "$CM_ENV"
          fi
      - name: Set up release signing
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build release AAB
        script: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d ' ' | cut -d+ -f1)
          flutter build appbundle \
            --release \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file=$ENV_FILE \
            --dart-define=APP_VERSION="$APP_VERSION"
      - name: Release notes from commits
        script: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          git log $RANGE --no-merges --pretty='%s' 2>/dev/null \
            | grep -E '^(feat|fix|perf)(\(.+\))?!?:' \
            | sed -E 's/^(feat|fix|perf)(\(.+\))?!?: */- /' > release_notes.txt || true
          [ -s release_notes.txt ] || echo "- Improvements and fixes" > release_notes.txt
          cat release_notes.txt
      - name: Tag this release (best-effort)
        script: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d ' ' | cut -d+ -f1)
          TAG="v${APP_VERSION}+${PROJECT_BUILD_NUMBER}"
          git tag "$TAG" 2>/dev/null && git push origin "$TAG" 2>/dev/null \
            && echo "tagged $TAG" || echo "tag skipped (exists or no push rights)"
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - release_notes.txt
    publishing:
      # Declarative publish does NOT push "what's new". To auto-fill it, swap for a
      # scripted `google-play` publish using release_notes.txt:
      #   --release-notes "pt-BR=$(cat release_notes.txt)"
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK

  ios-appstore:
    name: iOS · App Store (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CHANGE_ME_asc_api_key_name
    environment:
      flutter: CHANGE_ME_flutter_version
      xcode: latest
      groups:
        - CHANGE_ME_env_group
    working_directory: frontend
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Resolve environment from branch
        script: |
          if [ "$CM_BRANCH" = "main" ]; then
            echo "ENV_FILE=env/prod.env" >> "$CM_ENV"
          else
            echo "ENV_FILE=env/staging.env" >> "$CM_ENV"
          fi
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "CHANGE_ME_bundle_id" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d ' ' | cut -d+ -f1)
          flutter build ipa \
            --release \
            --export-method app-store \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file=$ENV_FILE \
            --dart-define=APP_VERSION="$APP_VERSION"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
