name: Mobile version bump

# Framework-free release-versioning engine, shared by every app in the org.
# It derives the next semantic version from Conventional Commits since this
# app's last tag, writes it into the app's native version file, then commits
# and tags using a GitHub App installation token — no PRs, no personal access
# tokens.
#
# Zero per-repo code for the common stacks: point `app-dir` at the app and the
# engine auto-detects Flutter (pubspec.yaml) or Node/Capacitor (package.json).
# An exotic stack can still supply a `version-script` (get|set) to override.
#
# A new app only needs the thin caller (see the "Mobile release" workflow
# template) plus the one-time org setup (App installed on the repo, the
# AUTOMATION_APP_PRIVATE_KEY secret, and AUTO_RELEASE=true).

on:
  workflow_call:
    inputs:
      app-dir:
        description: Path to the app whose version file is auto-detected.
        type: string
        default: '.'
      tag-prefix:
        description: Tag namespace for this app (keeps monorepo apps apart).
        type: string
        default: v
      version-script:
        description: Optional `get|set` adapter for a stack we don't auto-detect.
        type: string
        default: ''
      app-id:
        description: GitHub App id that authors the release commit and tag.
        type: string
        default: '1117691' # rubrion automation App
    secrets:
      app-private-key:
        description: Private key (.pem) of the GitHub App named in `app-id`.
        required: true
    outputs:
      released:
        description: 'true when a new version was committed and tagged'
        value: ${{ jobs.bump.outputs.released }}
      version:
        description: The resulting semver (X.Y.Z)
        value: ${{ jobs.bump.outputs.version }}

jobs:
  bump:
    runs-on: ubuntu-latest
    # The engine authors its own release commit with [skip ci]; never recurse.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Mint GitHub App token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true

      - name: Plan release
        id: plan
        env:
          APP_DIR: ${{ inputs.app-dir }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          VERSION_SCRIPT: ${{ inputs.version-script }}
        run: |
          set -euo pipefail

          # Detect where the version lives. An explicit adapter wins; otherwise
          # auto-detect the common mobile stacks.
          if [ -n "$VERSION_SCRIPT" ] && [ -f "$VERSION_SCRIPT" ]; then
            kind=custom; chmod +x "$VERSION_SCRIPT"
          elif [ -f "$APP_DIR/pubspec.yaml" ]; then
            kind=flutter
          elif [ -f "$APP_DIR/package.json" ]; then
            kind=node
          else
            echo "::error::no version source in '$APP_DIR' (expected pubspec.yaml, package.json, or a version-script)"
            exit 1
          fi
          echo "kind=$kind app_dir=$APP_DIR"

          case "$kind" in
            custom)  current="$("$VERSION_SCRIPT" get)" ;;
            flutter) current="$(sed -n 's/^version: *//p' "$APP_DIR/pubspec.yaml" | tr -d ' ' | cut -d'+' -f1)" ;;
            node)    current="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('$APP_DIR/package.json','utf8')).version)")" ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

          last_tag="$(git tag --list "${TAG_PREFIX}*" --sort=-v:refname | head -n1 || true)"
          echo "current=$current last_tag=${last_tag:-<none>}"

          # Bootstrap: no tag for this app yet. Tag the current version at HEAD so
          # the NEXT push bumps from a real baseline; don't re-bump history.
          if [ -z "$last_tag" ]; then
            {
              echo "mode=bootstrap"
              echo "released=false"
              echo "version=$current"
              echo "new_tag=${TAG_PREFIX}${current}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${last_tag#"$TAG_PREFIX"}"; base="${base%%+*}"
          range="${last_tag}..HEAD"

          # Conventional Commits -> bump level. Highest wins.
          level=none
          if git log "$range" --no-merges --pretty='%s%n%b' \
               | grep -qE '(^[a-z]+(\(.+\))?!:)|^BREAKING CHANGE'; then
            level=major
          elif git log "$range" --no-merges --pretty='%s' \
               | grep -qE '^feat(\(.+\))?:'; then
            level=minor
          elif git log "$range" --no-merges --pretty='%s' \
               | grep -qE '^(fix|perf)(\(.+\))?:'; then
            level=patch
          fi
          echo "level=$level"

          if [ "$level" = none ]; then
            {
              echo "mode=none"
              echo "released=false"
              echo "version=$base"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_ifs="$IFS"; IFS='.'; set -- $base; IFS="$old_ifs"
          ma="${1:-0}"; mi="${2:-0}"; pa="${3:-0}"
          case "$level" in
            major) ma=$((ma + 1)); mi=0; pa=0 ;;
            minor) mi=$((mi + 1)); pa=0 ;;
            patch) pa=$((pa + 1)) ;;
          esac
          next="${ma}.${mi}.${pa}"
          echo "bump $level: $base -> $next"
          {
            echo "mode=release"
            echo "released=true"
            echo "version=$next"
            echo "new_tag=${TAG_PREFIX}${next}"
          } >> "$GITHUB_OUTPUT"

      - name: Apply, commit and tag
        if: ${{ steps.plan.outputs.mode != 'none' }}
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          KIND: ${{ steps.plan.outputs.kind }}
          NEW_TAG: ${{ steps.plan.outputs.new_tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          APP_DIR: ${{ inputs.app-dir }}
          VERSION_SCRIPT: ${{ inputs.version-script }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          if [ "$MODE" = bootstrap ]; then
            git tag "$NEW_TAG"
            git push origin "refs/tags/${NEW_TAG}"
            echo "baseline tag ${NEW_TAG} created"
            exit 0
          fi

          # Write the new version into the app's native file (same detection).
          case "$KIND" in
            custom)
              "$VERSION_SCRIPT" set "$VERSION" ;;
            flutter)
              cur="$(sed -n 's/^version: *//p' "$APP_DIR/pubspec.yaml" | tr -d ' ')"
              case "$cur" in *+*) b="${cur##*+}" ;; *) b=0 ;; esac
              case "$b" in ''|*[!0-9]*) b=0 ;; esac
              tmp="$(mktemp)"
              sed -E "s/^version: .*/version: ${VERSION}+$((b + 1))/" "$APP_DIR/pubspec.yaml" >"$tmp"
              mv "$tmp" "$APP_DIR/pubspec.yaml" ;;
            node)
              node -e "const fs=require('fs');const f='$APP_DIR/package.json';const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$VERSION" ;;
          esac

          git add -A
          git commit -m "chore(release): ${NEW_TAG} [skip ci]"
          git tag "$NEW_TAG"
          git push origin "HEAD:${BRANCH}"
          git push origin "refs/tags/${NEW_TAG}"
          echo "released ${NEW_TAG}"
